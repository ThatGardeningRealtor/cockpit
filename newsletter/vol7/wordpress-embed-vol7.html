<div style="max-width:660px;margin:0 auto;">

    src="https://thatgardeningrealtor.github.io/cockpit/newsletter/TGR-Garden-Edition-Vol7.html"
    style="width:100%;border:0;display:block;"
    id="tgr-vol7-frame"
    scrolling="no"
    title="Green Thumb Weekly Garden Edition Vol. 7">

<script>
(function() {
  window.addEventListener('message', function(e) {
